    class Symbol {

        text(this.character, this.x, this.y);

    class Stream {
      constructor(options) {
        const { x, y, speed, length } = options;
        this.symbols = [];
        for (let i = 0; i < length; i += 1) {
          const baseLightness = (1 - (i / length));
          const lightnessMultiplier = (i < 3) ? (100 - (i * 5)) : 50;
          const symbol = new Symbol({
            x,
            y: y - (textSize() * i),
